<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CcCode</title><link rel="icon" type="image/png" href="/static/cccode-icon.png"><link rel="stylesheet" href="/static/style.css?v=6"></head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img width="27" height="27" class="brand-icon app-icon" src="/static/cccode-icon.png" alt=""><span>CcCode</span><span class="brand-tag">AGENT</span></div>
    <button id="new-chat" class="new-chat"><span>＋</span> 新建对话 <kbd>⌘ K</kbd></button>
    <div class="side-label">工作空间</div>
    <div class="workspace"><span class="folder">▱</span><span><strong id="workspace">当前项目</strong><small id="cwd">正在连接</small></span></div>
    <nav id="sessions" class="sessions" aria-label="会话历史"></nav>
    <div class="side-bottom"><span class="status-dot" id="dot"></span><span id="connection">正在连接</span><span class="version">v0.1</span></div>
  </aside>
  <main>
    <header><div><span class="crumb">工作空间</span><span class="separator">/</span><strong id="header-title">Agent</strong></div><div class="header-right"><img width="19" height="19" class="model-icon app-icon" src="/static/cccode-icon.png" alt=""><span id="model">连接模型中</span><span class="live-dot"></span></div></header>
    <div id="scroll" class="scroll"><section id="welcome" class="welcome"><img width="48" height="48" class="welcome-icon app-icon" src="/static/cccode-icon.png" alt=""><div class="eyebrow">YOUR CODING AGENT</div><h1>今天想构建什么？</h1><p>描述你的想法，CcCode 会帮你探索、规划并完成工作。</p><div class="suggestions"><button data-prompt="请先帮我理解这个项目的结构和主要功能。"><b>⌕</b><span>探索代码库<small>了解项目结构与核心逻辑</small></span><i>↗</i></button><button data-prompt="请检查当前项目有哪些值得改进的地方。"><b>◇</b><span>审查项目<small>发现问题和改进机会</small></span><i>↗</i></button><button data-prompt="请帮我规划一个功能实现方案。"><b>▤</b><span>规划功能<small>把想法拆解为可执行步骤</small></span><i>↗</i></button></div></section><section id="messages" class="messages" aria-live="polite"></section></div>
    <div class="composer-area"><div id="interaction"></div><form id="form" class="composer"><textarea id="input" rows="1" placeholder="描述你想完成的任务..." aria-label="输入消息"></textarea><div class="composer-bottom"><div class="controls"><span class="composer-label"><img width="16" height="16" class="composer-icon app-icon" src="/static/cccode-icon.png" alt=""> CcCode</span><span class="control-separator"></span><div class="mode-picker" id="mode-picker"><button type="button" id="mode-trigger" class="mode-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="mode-menu" disabled><svg class="mode-shield" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 5 6v5c0 4.3 2.8 7.8 7 10 4.2-2.2 7-5.7 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span id="mode-label">默认权限</span><span class="mode-down" aria-hidden="true">⌄</span></button><div class="mode-menu" id="mode-menu" role="menu" aria-label="权限模式" hidden><div class="mode-menu-title">选择权限模式</div><button type="button" role="menuitemradio" data-mode="default" aria-checked="true"><span class="mode-symbol">◇</span><span class="mode-copy"><strong>默认权限</strong><small>读取自动允许，编辑和命令需要确认</small></span><span class="mode-check">✓</span></button><button type="button" role="menuitemradio" data-mode="acceptEdits" aria-checked="false"><span class="mode-symbol">✎</span><span class="mode-copy"><strong>自动接受编辑</strong><small>读取和编辑自动允许，命令需要确认</small></span><span class="mode-check">✓</span></button><button type="button" role="menuitemradio" data-mode="plan" aria-checked="false"><span class="mode-symbol">▤</span><span class="mode-copy"><strong>计划模式</strong><small>分析与规划，限制写入及命令执行</small></span><span class="mode-check">✓</span></button><button type="button" role="menuitemradio" data-mode="custom" aria-checked="false"><span class="mode-symbol">⚙</span><span class="mode-copy"><strong>自定义</strong><small>根据权限规则处理，其余操作需要确认</small></span><span class="mode-check">✓</span></button><button type="button" class="mode-risk" role="menuitemradio" data-mode="dontAsk" aria-checked="false"><span class="mode-symbol">!</span><span class="mode-copy"><strong>不询问</strong><small>默认自动允许操作</small></span><span class="mode-check">✓</span></button><button type="button" class="mode-risk" role="menuitemradio" data-mode="bypassPermissions" aria-checked="false"><span class="mode-symbol">!</span><span class="mode-copy"><strong>跳过权限</strong><small>默认自动允许操作</small></span><span class="mode-check">✓</span></button></div></div></div><div class="send-group"><span class="hint">Enter 发送 · Shift + Enter 换行</span><button type="button" id="stop" class="stop" hidden>■ 停止</button><button type="submit" id="send" class="send" aria-label="发送消息">↑</button></div></div></form><div class="footnote">CcCode 可以操作本地文件，请检查重要更改。</div></div>
  </main>
</div><script src="/static/app.js?v=6" defer></script>
</body></html>
