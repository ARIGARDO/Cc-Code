<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CcCode</title><link rel="icon" href="/static/cccode-icon.png"><link rel="stylesheet" href="/static/style.css?v=5"></head>
<body><div class="shell">
<aside class="sidebar"><div class="brand"><img src="/static/cccode-icon.png" width="25" height="25" alt=""><strong>CcCode</strong><span>AGENT</span></div><button id="new-chat" class="new-chat" type="button">⊕ 新会话</button><div class="side-label">工作区</div><div class="workspace"><span>▱</span><span id="workspace">当前项目</span></div><div id="cwd" class="workspace-path"></div><nav id="sessions" class="sessions" aria-label="会话历史"></nav><div class="side-bottom"><span id="dot" class="status-dot"></span><span id="connection">正在连接</span></div></aside>
<main><header><span id="header-title">新会话</span><span id="model">连接模型中</span></header><div id="scroll" class="scroll"><section id="welcome" class="welcome"><img src="/static/cccode-icon.png" width="34" height="34" alt=""><h1>开始新的任务</h1></section><section id="messages" class="messages" aria-live="polite"></section></div><div class="composer-area"><div id="interaction"></div><form id="form" class="composer"><textarea id="input" rows="2" placeholder="描述你想要构建的内容，输入 / 调用指令" aria-label="输入消息"></textarea><div class="composer-bottom"><div class="mode-picker" id="mode-picker"><button type="button" id="mode-trigger" class="mode-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="mode-menu" disabled>♧ <span id="mode-label">默认权限</span> ⌄</button><div class="mode-menu" id="mode-menu" role="menu" aria-label="权限模式" hidden><div class="mode-menu-title">选择权限模式</div><button type="button" role="menuitemradio" data-mode="default" aria-checked="true"><span class="mode-copy"><strong>默认权限</strong><small>读取自动允许，编辑和命令需要确认</small></span><span class="mode-check">✓</span></button><button type="button" role="menuitemradio" data-mode="acceptEdits" aria-checked="false"><span class="mode-copy"><strong>自动接受编辑</strong><small>读取和编辑自动允许，命令需要确认</small></span><span class="mode-check">✓</span></button><button type="button" role="menuitemradio" data-mode="plan" aria-checked="false"><span class="mode-copy"><strong>计划模式</strong><small>分析与规划，限制写入及命令执行</small></span><span class="mode-check">✓</span></button><button type="button" role="menuitemradio" data-mode="custom" aria-checked="false"><span class="mode-copy"><strong>自定义</strong><small>根据权限规则处理，其余操作需要确认</small></span><span class="mode-check">✓</span></button><button type="button" role="menuitemradio" data-mode="dontAsk" aria-checked="false"><span class="mode-copy"><strong>不询问</strong><small>默认自动允许操作</small></span><span class="mode-check">✓</span></button><button type="button" role="menuitemradio" data-mode="bypassPermissions" aria-checked="false"><span class="mode-copy"><strong>跳过权限</strong><small>默认自动允许操作</small></span><span class="mode-check">✓</span></button></div></div><div class="send-group"><button type="button" id="stop" hidden>停止</button><button type="submit" id="send" aria-label="发送消息">↑</button></div></div></form></div></main></div><script src="/static/app.js?v=5" defer></script></body></html>
