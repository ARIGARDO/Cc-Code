[project]
name = "cc-code"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "textual>=0.80.0",
    "jsonschema>=4.20.0",
    "prompt_toolkit>=3.0.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cccode*"]

[tool.setuptools.package-data]
cccode = ["agents/builtins/*.md", "skills/builtins/**/*.md", "skills/builtins/**/*.json", "skills/builtins/**/references/*.py", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
